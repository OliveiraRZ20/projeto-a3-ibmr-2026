{% extends "base.html" %}
{% block title %}Cadastro | Quantium Bank{% endblock %}
{% block content %}
<section class="auth-card glass-card entrance">
    <div class="auth-orb">Q</div>
    <p class="eyebrow">NOVA CONTA</p>
    <h1>Crie seu acesso.</h1>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Nome completo<input name="nome" data-name-input maxlength="100" autocomplete="name" required></label>
        <label>CPF
            <input name="cpf_visual" data-cpf-input data-cpf-name="cpf" inputmode="numeric" maxlength="14" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" required>
        </label>
        <input type="hidden" name="cpf" data-cpf-value>
        <label>E-mail<input name="email" type="email" maxlength="254" pattern="[A-Za-z0-9]+([._%+\-][A-Za-z0-9]+)*@[A-Za-z0-9]([A-Za-z0-9\-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9\-]{0,61}[A-Za-z0-9])?)+$" autocomplete="email" required></label>
        <label>Telefone<input name="telefone" inputmode="numeric" maxlength="15" autocomplete="tel" placeholder="(00) 00000-0000" required></label>
        <label>Data de nascimento<input name="data_nascimento" type="date" required></label>
        <label>Senha
            <span class="password-field">
                <input name="senha" type="password" minlength="6" maxlength="128" data-password-input autocomplete="new-password" required>
                <button class="toggle-password" type="button" data-password-toggle>Mostrar</button>
            </span>
        </label>
        <p class="hint">Mínimo de 6 caracteres, sem espaços, com letras, número e símbolo.</p>
        <label>Confirme sua senha
            <span class="password-field">
                <input name="confirmacao_senha" type="password" minlength="6" maxlength="128" data-password-input autocomplete="new-password" required>
                <button class="toggle-password" type="button" data-password-toggle>Mostrar</button>
            </span>
        </label>
        <p class="hint password-match" data-password-match aria-live="polite"></p>
        <button class="primary button-wide" type="submit">Criar conta <span aria-hidden="true">→</span></button>
    </form>
    <p class="muted">Já possui conta? <a href="{{ url_for('login') }}">Voltar ao login</a></p>
</section>
{% endblock %}
