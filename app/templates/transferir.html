{% extends "base.html" %}
{% block title %}Transferir | Quantium Bank{% endblock %}
{% block content %}
<section class="form-card">
    <p class="eyebrow">MOVIMENTAÇÃO</p><h1>Enviar dinheiro.</h1>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>CPF do destinatário<input name="cpf_destino" inputmode="numeric" placeholder="000.000.000-00" required></label>
        <label>Valor<input name="valor" type="number" min="0.01" step="0.01" placeholder="0,00" required></label>
        <button class="primary" type="submit">Confirmar transferência</button>
    </form>
</section>
{% endblock %}
